services:
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save "" --appendonly no
    networks:
      - searxng
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8081/
    networks:
      - searxng
    depends_on:
      - redis
    restart: unless-stopped

networks:
  searxng:
